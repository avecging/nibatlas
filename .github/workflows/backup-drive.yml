name: Encrypted Drive backup

on:
  workflow_dispatch:
  # Lightweight hourly receipt check; exports only when 72 hours have elapsed.
  # Unlike */3 in day-of-month, this works across month/year boundaries.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: live-drive-backup
  cancel-in-progress: false

jobs:
  backup:
    # Enabling the variable is the final setup step after a verified manual run.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.BACKUP_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify built-in Python runtime
        run: /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), "Backup requires Python 3.12"'
      - name: Check backup behavior without credentials
        run: /usr/bin/python3 -m unittest discover -s scripts/backup -p 'test_*.py'
      - name: Check whether a full backup is due
        id: due
        env:
          BACKUP_GOOGLE_CLIENT_ID: ${{ secrets.BACKUP_GOOGLE_CLIENT_ID }}
          BACKUP_GOOGLE_CLIENT_SECRET: ${{ secrets.BACKUP_GOOGLE_CLIENT_SECRET }}
          BACKUP_GOOGLE_REFRESH_TOKEN: ${{ secrets.BACKUP_GOOGLE_REFRESH_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            /usr/bin/python3 scripts/backup/drive_backup.py --check-due --force
          else
            /usr/bin/python3 scripts/backup/drive_backup.py --check-due
          fi
      - name: Install backup tools from standard repositories
        if: steps.due.outputs.due == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age python3-venv
          /usr/bin/python3 -m venv "$RUNNER_TEMP/nibatlas-backup-venv"
          "$RUNNER_TEMP/nibatlas-backup-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/backup/requirements.txt
          docker pull postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
      - name: Export, encrypt and verify private Drive upload
        if: steps.due.outputs.due == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BACKUP_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          BACKUP_GOOGLE_CLIENT_ID: ${{ secrets.BACKUP_GOOGLE_CLIENT_ID }}
          BACKUP_GOOGLE_CLIENT_SECRET: ${{ secrets.BACKUP_GOOGLE_CLIENT_SECRET }}
          BACKUP_GOOGLE_REFRESH_TOKEN: ${{ secrets.BACKUP_GOOGLE_REFRESH_TOKEN }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_POSTGRES_CA_CERT: ${{ vars.BACKUP_POSTGRES_CA_CERT }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            "$RUNNER_TEMP/nibatlas-backup-venv/bin/python" scripts/backup/drive_backup.py --force
          else
            "$RUNNER_TEMP/nibatlas-backup-venv/bin/python" scripts/backup/drive_backup.py
          fi
      # No upload-artifact step: neither plaintext exports nor identities belong
      # in this public repository's downloadable Actions artifacts.

  backup-tests:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/backup -p 'test_*.py'
