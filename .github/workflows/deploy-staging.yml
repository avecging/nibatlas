name: Deploy staging

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/codex-m3-wp3-integration-hardening'
    name: Verify and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}
      # Browser-safe, but baked into the bundle at build time rather than read
      # from a Worker secret at runtime — so it has to be present *here*, not
      # only in `wrangler secret put`. Stored alongside the MapTiler key for
      # consistency; neither is confidential, and both must exist to build a
      # working staging Worker.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate staging secrets
        shell: bash
        env:
          NEXT_PUBLIC_CATALOGUE_MODE: api-demo
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$NEXT_PUBLIC_MAPTILER_KEY"
          test "$NEXT_PUBLIC_CATALOGUE_MODE" = "api-demo"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          # A build without this ships two forms that can only fail: no widget
          # renders, and the route refuses every submission because a production
          # build never accepts an unverified one.
          test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Deploy Cloudflare staging Worker
        shell: bash
        env:
          NEXT_PUBLIC_CATALOGUE_MODE: api-demo
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -o pipefail
          pnpm deploy:staging 2>&1 | tee "$RUNNER_TEMP/deploy-staging.log"
          staging_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RUNNER_TEMP/deploy-staging.log" | tail -1)"
          test -n "$staging_url"
          echo "STAGING_URL=$staging_url" >> "$GITHUB_ENV"
          {
            echo "### Nib Atlas staging"
            echo
            echo "Deployed commit: \`${GITHUB_SHA}\`"
            echo
            echo "Staging URL: ${staging_url}"
          } >> "$GITHUB_STEP_SUMMARY"
      # A `NEXT_PUBLIC_` value is inlined into the client bundle by matching the
      # literal `process.env.NEXT_PUBLIC_X` member expression. Write it any other
      # way — a bracket index, a destructure, a variable — and it compiles,
      # deploys, and is `undefined` in the browser. Nothing fails loudly: the
      # Turnstile widget simply never renders and every submission is refused.
      # Asserting the value reached the bundle is the only check that catches it.
      - name: Verify the Turnstile site key reached the client bundle
        shell: bash
        run: |
          grep -rqF "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" .open-next/assets/_next/static             || { echo "Site key absent from the built bundle — check it is read as process.env.NEXT_PUBLIC_TURNSTILE_SITE_KEY"; exit 1; }

      # ubuntu-latest already provides Chromium's system libraries. Installing
      # optional font packages here makes the live smoke gate depend on a slow
      # Ubuntu mirror even though typography is covered by the full E2E job.
      - run: pnpm exec playwright install chromium
      - name: Verify MapTiler geography and static MapLibre worker
        run: pnpm exec playwright test --project=staging-maptiler
      - name: Verify demo catalogue through map, detail, Back, and Nearby
        run: pnpm exec playwright test --project=staging-catalogue
      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-evidence
          path: |
            test-results/**/maptiler-geography.png
            test-results/**/catalogue-api-demo.png
          if-no-files-found: warn
          retention-days: 1
